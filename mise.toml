[settings]
all_compile = false
cargo.binstall_native = true
idiomatic_version_file_enable_tools = ["node", "pnpm", "python", "ruff", "rust"]
npm.package_manager = "npm"

[tools]
actionlint = "1.7.12"
cargo-binstall = "1.23.0"
ghalint = "1.5.6"
gitleaks = "8.30.1"
harper-cli = "2.10.0"
hk = "2.0.0"
jq = "1.8.2"
lychee = "0.24.2"
pinact = "5.0.0"
python = "3.14.7"
rumdl = "0.2.73"
rust = { version = "1.98.1", profile = "minimal", components = [
  "clippy",
  "rustfmt",
] }
shellcheck = "0.11.0"
shfmt = "3.14.1"
tombi = "1.5.5"
typos = "1.50.1"
uv = "0.12.13"
zizmor = "1.30.1"
"aqua:EmbarkStudios/cargo-deny" = { version = "0.20.2", depends = ["rust"] }
"aqua:anordal/shellharden" = "4.3.2"
"aqua:apple/pkl" = "0.32.1"
"aqua:owenlamont/ryl" = { version = "0.22.0", os = [
  "linux",
  "macos/arm64",
  "windows",
] }
"cargo:ryl" = { version = "0.22.0", os = ["macos/x64"] }
"github:mongodb/kingfisher" = "2.2.0"
"pipx:yamllint" = { version = "1.38.0", depends = ["python", "uv"] }

node = "26.8.2"
ruff = "0.16.7"
ty = "0.0.81"
"npm:sort-package-json" = "4.0.0"
